# Fly.io config. First deploy: `fly launch --no-deploy` (keep this file), then `fly deploy`.
app = "tximtxom"
primary_region = "mad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in memory: keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

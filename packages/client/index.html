<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2b2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TximTxom</title>
    <link rel="preload" href="assets/m6x11plus.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      /* Shown until the game's first assets load: a card turning over, red Joker,
         back, black Joker, back. The back's colour is picked at random below.
         assets/ui/loading.png is a strip: the two Jokers, then the six backs.
         Only transform and opacity animate, so the turn stays smooth while the
         page is busy starting the game. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: #1b2b2a;
        transition: opacity 0.3s;
        perspective: 500px;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading .card {
        position: relative;
        width: 84px;
        height: 120px;
        transform-style: preserve-3d;
        animation: loading-turn 1.2s linear infinite;
      }
      #loading .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
      }
      #loading .back {
        transform: rotateY(180deg);
      }
      #loading .face > i {
        position: absolute;
        inset: 0;
        background: url(assets/ui/loading.png) 0 0 / 672px 120px no-repeat;
        image-rendering: pixelated;
      }
      #loading .face > .black {
        background-position-x: -84px;
        opacity: 0;
        /* Shows from the first time the front faces away until the second. */
        animation: loading-black 2.4s step-end infinite;
      }
      #loading .back > i {
        background-position-x: var(--back, -168px);
      }
      @keyframes loading-turn {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(360deg);
        }
      }
      @keyframes loading-black {
        0% {
          opacity: 0;
        }
        25% {
          opacity: 1;
        }
        75% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .card {
          animation: loading-pulse 1.2s ease-in-out infinite alternate;
        }
        #loading .face > .black {
          animation: none;
        }
      }
      @keyframes loading-pulse {
        to {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-label="Loading"><div class="card"><div class="face"><i></i><i class="black"></i></div><div class="face back"><i></i></div></div></div>
    <script>
      // A new back colour on every load (one of the six in the strip, after the two Jokers).
      document.getElementById('loading').style.setProperty('--back', -(2 + Math.floor(Math.random() * 6)) * 84 + 'px');
    </script>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="stage" aria-hidden="true"></div>
    <div id="app"></div>
    <div id="crt" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2b2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TximTxom</title>
    <link rel="preload" href="assets/m6x11plus.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      /* Shown until the game's first assets load: a card back spinning. main.tsx removes it. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: #1b2b2a;
        transition: opacity 0.3s;
        perspective: 400px;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading img {
        width: 84px;
        height: 120px;
        image-rendering: pixelated;
        filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.35));
        animation: loading-flip 1.2s ease-in-out infinite;
      }
      @keyframes loading-flip {
        to {
          transform: rotateY(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading img {
          animation: loading-pulse 1.2s ease-in-out infinite alternate;
        }
      }
      @keyframes loading-pulse {
        to {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-label="Loading"><img src="assets/ui/loading.png" alt="" /></div>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="stage" aria-hidden="true"></div>
    <div id="app"></div>
    <div id="crt" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2b2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TximTxom</title>
    <link rel="preload" href="assets/m6x11plus.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      /* Shown until the game's first assets load: a card turning over, red Joker,
         back, black Joker, back. The back's colour is picked at random below.
         assets/ui/loading.png is a strip: the two Jokers, then the six backs.
         Only transform and opacity animate, so the turn stays smooth while the
         page is busy starting the game. */
      @font-face {
        font-family: m6x11;
        src: url(assets/m6x11plus.woff2) format('woff2');
      }
      #loading {
        user-select: none;
        -webkit-user-select: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #1b2b2a;
        transition: opacity 0.3s;
        perspective: 500px;
      }
      #loading p {
        margin: 0;
        font: 28px m6x11, monospace;
        color: #fff;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
        white-space: pre;
        /* Tall enough for the "Click to start" button that may replace the text. */
        min-height: 60px;
        display: flex;
        align-items: center;
      }
      /* The letters wobble and hop in turn like WaveText (ui/common.tsx), in CSS so
         they keep moving while the game loads; the script below adds loading-hop. */
      #loading p .l {
        display: inline-block;
        animation: loading-idle 1.3s ease-in-out infinite alternate, loading-hop var(--cycle) linear infinite;
      }
      @keyframes loading-idle {
        from {
          rotate: -2.5deg;
        }
        to {
          rotate: 2.5deg;
        }
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading .card {
        position: relative;
        width: 84px;
        height: 120px;
        transform-style: preserve-3d;
        /* One float up and down per turn, on the same beat: highest when it shows its back. */
        animation:
          loading-turn 1.2s linear infinite,
          loading-float 1.2s ease-in-out infinite;
      }
      #loading .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
      }
      #loading .back {
        transform: rotateY(180deg);
      }
      #loading .face > i {
        position: absolute;
        inset: 0;
        background: url(assets/ui/loading.png) 0 0 / 672px 120px no-repeat;
        image-rendering: pixelated;
      }
      #loading .face > .black {
        background-position-x: -84px;
        opacity: 0;
        /* Shows from the first time the front faces away until the second. */
        animation: loading-black 2.4s step-end infinite;
      }
      #loading .back > i {
        background-position-x: var(--back, -168px);
      }
      @keyframes loading-turn {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(360deg);
        }
      }
      @keyframes loading-float {
        0%,
        100% {
          translate: 0 2px;
        }
        50% {
          translate: 0 -8px;
        }
      }
      @keyframes loading-black {
        0% {
          opacity: 0;
        }
        25% {
          opacity: 1;
        }
        75% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .card {
          animation: loading-pulse 1.2s ease-in-out infinite alternate;
        }
        #loading .face > .black,
        #loading p .l {
          animation: none;
        }
      }
      @keyframes loading-pulse {
        to {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" role="status"><div class="card"><div class="face"><i></i><i class="black"></i></div><div class="face back"><i></i></div></div><p>Loading...</p></div>
    <script>
      // A new back colour on every load (one of the six in the strip, after the two Jokers).
      const loading = document.getElementById('loading');
      loading.style.setProperty('--back', -(2 + Math.floor(Math.random() * 6)) * 84 + 'px');
      // In the player's language (Portuguese unless they picked English, as in settings.ts).
      try {
        if ((JSON.parse(localStorage.getItem('tximtxom.settings') || '{}').lang || 'pt') === 'pt') loading.querySelector('p').textContent = 'A carregar...';
      } catch {}
      // One letter at a time: a 300 ms hop every 390 ms, then a quiet beat before starting over.
      const p = loading.querySelector('p');
      const text = p.textContent;
      const cycle = (text.replace(/ /g, '').length + 1) * 390;
      const hop = document.createElement('style');
      hop.textContent = `@keyframes loading-hop { 0% { translate: 0 0; animation-timing-function: ease-out } ${(15000 / cycle).toFixed(2)}% { translate: 0 -5px; animation-timing-function: ease-in } ${(30000 / cycle).toFixed(2)}%, 100% { translate: 0 0 } }`;
      document.head.append(hop);
      p.style.setProperty('--cycle', cycle + 'ms');
      p.setAttribute('aria-label', text);
      // One wrapper, so the flex layout keeps the spaces between words.
      const word = document.createElement('span');
      word.setAttribute('aria-hidden', 'true');
      let i = 0;
      word.append(
        ...[...text].map((ch) => {
          if (ch === ' ') return ' ';
          const s = document.createElement('span');
          s.className = 'l';
          s.textContent = ch;
          s.style.animationDelay = `${i * -0.37}s, ${i * 0.39}s`;
          i++;
          return s;
        }),
      );
      p.replaceChildren(word);
    </script>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="stage" aria-hidden="true"></div>
    <div id="app"></div>
    <div id="crt" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
